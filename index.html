<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Territórios — Gestão de Mapas</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1b3a3f" />

<!-- Leaflet (mapa) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<!-- Leaflet.draw (editar polígonos) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◈</span>
    <span class="brand-name">Territórios</span>
  </div>

  <select id="filterCongregacao" class="select-congregacao">
    <option value="">Todas as congregações</option>
  </select>
  <button id="btnAddCongregacao" class="btn-ghost" title="Cadastrar nova congregação">+ Congregação</button>

  <div class="topbar-stats" id="topbarStats">
    <span class="stat"><b id="statTotal">0</b> total</span>
    <span class="stat stat-disponivel"><b id="statDisponivel">0</b> disponíveis</span>
    <span class="stat stat-iniciado"><b id="statIniciado">0</b> em campo</span>
    <span class="stat stat-concluido"><b id="statConcluido">0</b> concluídos</span>
    <span class="stat stat-atrasado" title="Disponíveis há mais de 90 dias sem trabalhar"><b id="statAtrasado">0</b> atrasados</span>
  </div>
  <button id="btnImportGeoJSON" class="btn-ghost" title="Importar polígonos reais de data/territorios-import.geojson">Importar GeoJSON</button>
  <button id="btnSeed" class="btn-ghost" title="Gerar territórios placeholder em grade (só se ainda não tiver nenhum)">Gerar placeholders</button>
</header>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-controls">
      <input id="searchBox" type="text" placeholder="Buscar por código… (jrdTer01)" />

      <label class="field-label">Grupo</label>
      <select id="filterGrupo">
        <option value="">Todos os grupos</option>
      </select>

      <label class="field-label">Publicador</label>
      <select id="filterPublicador">
        <option value="">Todos os publicadores</option>
      </select>

      <label class="field-label">Fase</label>
      <select id="filterStatus">
        <option value="">Todas as fases</option>
        <option value="disponivel">Livre</option>
        <option value="designado">Designado</option>
        <option value="iniciado">Em Campo</option>
        <option value="concluido">Concluído</option>
      </select>

      <button id="btnSelecionarTodos" class="btn-ghost btn-select-all">Selecionar todos os filtrados</button>
    </div>

    <div id="bulkBar" class="bulk-bar hidden">
      <span id="bulkCount">0 selecionados</span>
      <select id="bulkGrupoSelect">
        <option value="">Sem grupo</option>
      </select>
      <button id="btnAplicarGrupoLote" class="btn-action">Aplicar grupo</button>
      <select id="bulkPublicadorSelect">
        <option value="">Sem publicador</option>
      </select>
      <button id="btnAplicarPublicadorLote" class="btn-action">Aplicar publicador</button>
      <button id="btnLimparSelecao" class="btn-ghost">Limpar</button>
    </div>

    <ul id="territoryList" class="territory-list"></ul>
  </aside>

  <main class="map-wrap">
    <div id="map"></div>
  </main>

  <aside id="detailPanel" class="detail-panel hidden">
    <button id="closeDetail" class="btn-close" aria-label="Fechar">×</button>

    <div class="detail-title-row">
      <h2 id="detailCode">—</h2>
      <span id="detailStatusBadge" class="badge">—</span>
    </div>

    <div class="detail-info-grid">
      <div><b>Congregação</b><select id="detailCongregacaoSelect" class="inline-select"></select></div>
      <div><b>Designado a</b><select id="detailPublicadorSelect" class="inline-select"></select></div>

      <div><b>Grupo</b><select id="detailGrupoSelect" class="inline-select"></select></div>
      <div><b>Pontos registrados</b><span id="detailPontosCount">0</span></div>

      <div><b>Data de saída</b><span id="detailDataSaida">--/--/----</span></div>
      <div><b>Última conclusão</b><span id="detailUltimaConclusao">--/--/----</span></div>
    </div>

    <div class="add-publicador-row detail-block">
      <input type="text" id="inpNovoPublicador" placeholder="Cadastrar novo publicador…" />
      <button id="btnAddPublicador" class="btn-ghost btn-add-pub">+</button>
    </div>

    <div class="btn-row">
      <button id="btnDesignar" class="btn-fase btn-designar">📋 Designar</button>
      <button id="btnEmCampo" class="btn-fase btn-em-campo">🚶 Em Campo</button>
      <button id="btnConcluir" class="btn-fase btn-concluir-fase">✅ Concluir</button>
      <button id="btnLiberar" class="btn-fase btn-liberar-fase">🔓 Liberar</button>
    </div>

    <div class="btn-row">
      <button id="btnVerNoMaps" class="btn-fase btn-ver-maps">🗺️ Ver no Maps</button>
      <button id="btnOpenMaps" class="btn-fase btn-rota">🚗 Rota até Território</button>
      <button id="btnMarcarPonto" class="btn-fase btn-marcar-ponto">📍 Marcar Ponto</button>
    </div>

    <div class="detail-block pontos-section">
      <label class="field-label">Pontos &amp; notas do território</label>
      <ul id="detailPontosList" class="pontos-list"></ul>
    </div>

    <div class="detail-block">
      <label class="field-label">Observações gerais</label>
      <textarea id="inpObservacoes" rows="3" placeholder="Notas sobre este território…"></textarea>
      <button class="btn-ghost" id="btnSalvarObs">Salvar observações</button>
    </div>

    <div class="detail-block">
      <button class="btn-ghost" id="btnEditarPoligono">✎ Editar contorno no mapa</button>
    </div>

    <div class="detail-block">
      <label class="field-label">Histórico</label>
      <ul id="detailHistorico" class="historico-list"></ul>
    </div>
  </aside>

</div>

<!-- Firebase (compat SDK — sem bundler, direto no navegador) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<!-- Adicione esta linha para habilitar o login de publicadores e validar as regras -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/seed.js"></script>
<script src="js/import-geojson.js"></script>
<script src="js/app.js"></script>
</body>
</html>
